<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Suggestions</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#0b1120,#111827,#312e81);
color:white;
min-height:100vh;
padding:50px;
}

.box{
max-width:900px;
margin:auto;
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.08);
padding:40px;
border-radius:24px;
backdrop-filter:blur(12px);
box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

.logo{
font-size:30px;
font-weight:700;
margin-bottom:10px;
}

.logo span{
color:#a855f7;
}

h2{
margin-bottom:25px;
color:#cbd5e1;
font-weight:500;
}

.suggestion-box{
background:rgba(255,255,255,0.05);
padding:28px;
border-radius:18px;
line-height:1.8;
color:#e2e8f0;
white-space:pre-wrap;
font-size:16px;
}

.actions{
margin-top:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

.btn{
display:inline-block;
padding:14px 24px;
border-radius:30px;
background:linear-gradient(to right,#2563eb,#9333ea);
color:white;
text-decoration:none;
transition:0.3s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn2{
display:inline-block;
padding:14px 24px;
border-radius:30px;
border:1px solid rgba(255,255,255,0.2);
color:white;
text-decoration:none;
}

.btn2:hover{
background:rgba(255,255,255,0.06);
}

@media(max-width:768px){
body{
padding:25px;
}
.box{
padding:25px;
}
}
</style>
</head>

<body>

<div class="box">

<div class="logo">HireSense <span>AI</span></div>

<h2>Gemini Resume Suggestions</h2>

<div class="suggestion-box">
{{ suggestions }}
</div>

<div class="actions">
<a href="/dashboard/" class="btn">Back to Dashboard</a>
<a href="/dashboard/" class="btn2">Analyze Another Resume</a>
</div>

</div>

</body>
</html>

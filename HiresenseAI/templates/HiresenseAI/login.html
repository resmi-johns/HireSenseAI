<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HireSense AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

.error-msg{
color:red;
}


body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0b1120,#111827,#312e81);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{
width:430px;
padding:40px;
border-radius:24px;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

h1{
font-size:34px;
margin-bottom:10px;
}

p{
color:#cbd5e1;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:16px;
border:none;
outline:none;
border-radius:14px;
background:rgba(255,255,255,0.08);
color:white;
font-size:15px;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(to right,#2563eb,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-3px);
}

.bottom{
margin-top:18px;
text-align:center;
color:#cbd5e1;
}

.bottom a{
color:#c084fc;
text-decoration:none;
}
</style>
</head>

<body>

<div class="card">
<h1>Login</h1>

<form method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">

<button type="submit">Sign In</button>

</form>

<div class="bottom">
New here? <a href="/signup/">Create Account</a>

{% if messages %}
    {% for message in messages %}
        <div class="error-msg">{{ message }}</div>
    {% endfor %}
{% endif %}

</div>

</div>

</body>
</html>
